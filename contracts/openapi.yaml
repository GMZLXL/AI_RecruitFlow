            - failed
          - type: 'null'
          title: Latest Result
        sync_status:
          anyOf:
          - $ref: '#/components/schemas/SyncState'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - id
      - version
      - created_at
      - updated_at
      - application_code
      - candidate_id
      - candidate_name
      - position_id
      - position_title
      - owner_id
      - source_channel
      - stage
      - outcome
      - custom_fields
