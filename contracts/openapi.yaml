          anyOf:
          - type: string
          - type: 'null'
          title: Confirmation Id
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      additionalProperties: false
      type: object
      required:
      - status
      - application
      title: ApplicationMutation
    ApplicationPatch:
      properties:
        stage:
          anyOf:
          - $ref: '#/components/schemas/Stage'
          - type: 'null'
        source_channel:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Source Channel
        custom_fields:
          anyOf:
          - additionalProperties:
              type: string
              maxLength: 120
              minLength: 1
            propertyNames:
              const: organization.referral_tag
            type: object
          - type: 'null'
          title: Custom Fields
        change_reason:
          type: string
          maxLength: 500
          minLength: 1
          title: Change Reason
      additionalProperties: false
      type: object
      required:
      - change_reason
      title: ApplicationPatch
