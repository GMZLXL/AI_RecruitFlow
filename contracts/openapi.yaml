          type: integer
          minimum: 1.0
          title: Version
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        application_code:
          type: string
          title: Application Code
        candidate_id:
          type: string
          title: Candidate Id
        candidate_name:
          type: string
          title: Candidate Name
        position_id:
          type: string
          title: Position Id
        position_title:
          type: string
          title: Position Title
        owner_id:
          type: string
          title: Owner Id
        source_channel:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Channel
        stage:
          $ref: '#/components/schemas/Stage'
        outcome:
          $ref: '#/components/schemas/Outcome'
        custom_fields:
          additionalProperties:
            type: string
            maxLength: 120
            minLength: 1
          propertyNames:
            const: organization.referral_tag
          type: object
          title: Custom Fields
        owner_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Name
