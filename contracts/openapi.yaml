components:
  schemas:
    AISettingsRead:
      properties:
        version:
          type: integer
          title: Version
        provider:
          type: string
          enum:
          - mock
          - deepseek
          title: Provider
        model:
          type: string
          title: Model
        has_api_key:
          type: boolean
          title: Has Api Key
        key_source:
          type: string
          enum:
          - managed
          - environment
          - none
          title: Key Source
        secret_store_ready:
          type: boolean
          title: Secret Store Ready
        real_calls_allowed:
          type: boolean
          title: Real Calls Allowed
        status:
          type: string
          enum:
          - mock_only
          - blocked_by_credentials
          - configured_not_verified
          - mode_mismatch
          title: Status
      additionalProperties: false
      type: object
      required:
      - version
      - provider
      - model
      - has_api_key
      - key_source
      - secret_store_ready
      - real_calls_allowed
      - status
      title: AISettingsRead
    AISettingsUpdate:
      properties:
        provider:
          type: string
          enum:
          - mock
          - deepseek
          title: Provider
        model:
          type: string
          maxLength: 120
          minLength: 1
          pattern: ^[A-Za-z0-9_.\-]+$
          title: Model
        api_key:
          anyOf:
          - type: string
            format: password
            writeOnly: true
          - type: 'null'
          title: Api Key
        clear_api_key:
          type: boolean
          title: Clear Api Key
          default: false
        change_reason:
          type: string
          maxLength: 300
          minLength: 1
          title: Change Reason
      additionalProperties: false
      type: object
      required:
      - provider
      - model
      - change_reason
      title: AISettingsUpdate
    ApiError:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        details:
          additionalProperties: true
          type: object
          title: Details
      additionalProperties: false
      type: object
      required:
      - code
      - message
      title: ApiError
    ApplicationCreate:
      properties:
        candidate_id:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          - type: 'null'
          title: Candidate Id
        position_id:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          - type: 'null'
          title: Position Id
        candidate_name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Candidate Name
        position_title:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
          - type: 'null'
          title: Position Title
        application_code:
          anyOf:
          - type: string
            maxLength: 40
            minLength: 1
            pattern: ^[A-Z0-9_-]+$
          - type: 'null'
          title: Application Code
        source_channel:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Source Channel
        custom_fields:
          additionalProperties:
            type: string
            maxLength: 120
            minLength: 1
          propertyNames:
            const: organization.referral_tag
          type: object
          title: Custom Fields
      additionalProperties: false
      type: object
      title: ApplicationCreate
    ApplicationMutation:
      properties:
        status:
          type: string
          enum:
          - applied
          - needs_confirmation
          title: Status
        application:
          $ref: '#/components/schemas/ApplicationRead'
