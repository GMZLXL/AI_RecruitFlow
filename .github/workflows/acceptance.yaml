name: Release acceptance

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/demo/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Mock acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install exact locked dependencies
        run: |
          python -m venv backend/.venv
          node scripts/workspace/python.mjs -m pip install --require-hashes -r requirements.lock
          npm ci
      - name: T01-T18, types, contracts, build, isolated HTTP and synthetic SSO
        run: npm run acceptance
      - name: Retain machine-readable evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-${{ matrix.os }}
          path: .tools/s7-acceptance-*/
          include-hidden-files: true
          retention-days: 14

  containers:
    name: Compose build and runtime (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate both Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.production.yaml --env-file deploy/production.env.example config --quiet
      - name: Build and start the no-key Mock stack
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Exercise the built SPA and API through Nginx
        working-directory: backend
        env:
          RECRUITFLOW_WEB_URL: http://127.0.0.1:8080
          RECRUITFLOW_API_URL: http://127.0.0.1:8080/api/v1
          RECRUITFLOW_WEB_BUILD: production
        run: |
          python -m pip install --require-hashes -r requirements.runtime.lock
          python -m scripts.smoke.http
      - name: Runtime status and safe logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 100
      - name: Stop this runner's stack
        if: always()
        run: docker compose down
